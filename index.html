        </div>
      </div>
    </div>
    <script>
      (function() {
        window.dismissClassicoStartup = function() {
          var screen = document.getElementById('startup-screen');
          if (!screen || screen.dataset.dismissing === 'true') return;
          screen.dataset.dismissing = 'true';
          screen.classList.add('fade-out');
          setTimeout(function() {
            try {
              if (screen && screen.parentNode) screen.parentNode.removeChild(screen);
            } catch (e) {}
          }, 700);
        };
        // Guaranteed safety fade out if React initialization is delayed
        window.addEventListener('load', function() {
          setTimeout(function() {
            if (window.dismissClassicoStartup) {
              window.dismissClassicoStartup();
            }
          }, 1800);
        });
      })();
    </script>
    <div id="root"></div>
