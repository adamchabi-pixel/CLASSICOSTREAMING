    <style>
      @keyframes illuminate { 0%, 100% { opacity: 0.2; transform: scale3d(0.8, 0.8, 1); } 50% { opacity: 1; transform: scale3d(1.2, 1.2, 1); } }
      @media (min-width: 640px) {
        #startup-screen span:first-child { font-size: 2.25rem !important; }
        #startup-screen > span:nth-child(2) { font-size: 1.5rem !important; margin-top:-4px !important; }
      }
      @media (min-width: 768px) {
        #startup-screen span:first-child { font-size: 3rem !important; }
        #startup-screen > span:nth-child(2) { font-size: 1.875rem !important; margin-top:-4px !important; }
      }
    </style>
  </head>
  <body class="bg-black text-white">
    <div id="root">
      <div id="startup-screen" style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;background-color:#000;pointer-events:none;user-select:none;">
        <div style="position:relative;overflow:hidden;display:flex;align-items:center;">
          <span style="font-family:'Cinzel',serif;font-weight:700;font-size:1.875rem;letter-spacing:0.22em;text-transform:uppercase;line-height:1;background:linear-gradient(135deg, #bf953f 0%, #fcf6ba 15%, #b38728 35%, #fbf5b7 55%, #aa771c 75%, #fcf6ba 90%, #bf953f 100%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
            CLASSICO
          </span>
        </div>
        <span style="font-family:'Pinyon Script',cursive;display:block;font-size:1.25rem;color:#f4ecd8;line-height:1;margin-top:-2px;user-select:none;text-align:center;transform:translateX(-3px);filter:drop-shadow(0 0 4px rgba(244,236,216,0.2));">
          The Best
        </span>
        <div style="display:flex;gap:8px;margin-top:32px;">
          <div style="width:8px;height:8px;border-radius:50%;background-color:#fcf6ba;box-shadow:0 0 10px rgba(252,246,186,0.8);animation:illuminate 1.5s infinite ease-in-out both;animation-delay:0s;"></div>
          <div style="width:8px;height:8px;border-radius:50%;background-color:#fcf6ba;box-shadow:0 0 10px rgba(252,246,186,0.8);animation:illuminate 1.5s infinite ease-in-out both;animation-delay:-1.0s;"></div>
          <div style="width:8px;height:8px;border-radius:50%;background-color:#fcf6ba;box-shadow:0 0 10px rgba(252,246,186,0.8);animation:illuminate 1.5s infinite ease-in-out both;animation-delay:-0.5s;"></div>
        </div>
        
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
